version: '3.8'

# Local-dev compose. Production uses Lambda (backend) + Amplify (frontends).
# Run with: docker compose up
services:
  backend:
    build: ./apps/backend
    container_name: pipelyt-backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend:/app
      - /app/venv # Don't overwrite container venv with local venv

  product-page:
    image: node:20-alpine
    container_name: pipelyt-product-page
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./apps/product-page:/app
      - /app/node_modules

  landing-page:
    image: node:20-alpine
    container_name: pipelyt-landing-page
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_URL=http://localhost:5173
    volumes:
      - ./apps/landing-page:/app
      - /app/node_modules
