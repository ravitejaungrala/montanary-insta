name: Deploy Backend to Lambda

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Configure AWS Credentials
        # Pinned point release — floating @v4 was 404ing on codeload.
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        # Fails fast with a clear message if the GitHub Actions AWS secrets
        # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) are stale or mistyped —
        # surfaces credential issues here instead of mid-deploy.
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set Environment Variables
        id: envs
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ECR_REPOSITORY=pipelyt-backend" >> $GITHUB_ENV
            echo "LAMBDA_FUNCTION=pipelyt-backend" >> $GITHUB_ENV
            echo "deploy_heartbeat=true" >> $GITHUB_OUTPUT
          else
            echo "ECR_REPOSITORY=staging-pipelyt-backend" >> $GITHUB_ENV
            echo "LAMBDA_FUNCTION=pipelyt-stagging-backend" >> $GITHUB_ENV
            echo "deploy_heartbeat=false" >> $GITHUB_OUTPUT
          fi

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image for Lambda in apps/backend ($ECR_REPOSITORY)..."
          cd apps/backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Backend Lambda
        run: |
          echo "Updating backend function: $LAMBDA_FUNCTION..."
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Update Scheduler Heartbeat (Main Only)
        if: steps.envs.outputs.deploy_heartbeat == 'true'
        run: |
          echo "Updating scheduler heartbeat..."
          aws lambda update-function-code \
            --function-name Pipelyt-Scheduler-Heartbeat \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Update Scheduler Heartbeat (Staging Only)
        # Staging has its OWN heartbeat function so it never shares (or risks)
        # the production heartbeat. It runs the staging image + points at the
        # staging backend via its own BACKEND_URL / SCHEDULER_SECRET env vars.
        if: github.ref_name == 'staging'
        run: |
          echo "Updating staging scheduler heartbeat..."
          aws lambda update-function-code \
            --function-name Pipelyt-Scheduler-Heartbeat-Staging \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Finish Deployment
        run: echo "All Lambda functions updated successfully! 🚀"
